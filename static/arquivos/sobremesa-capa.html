<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Doce Equilíbrio — Capa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:850px;overflow:hidden}
  @media print{
    @page{size:600px 850px;margin:0}
    html,body{width:600px;height:850px}
  }
  body{
    font-family:'Lato',sans-serif;
    background:#1c0d07;
    color:#fdf3e4;
    width:600px;
    height:850px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* Faixas decorativas laterais */
  .border-frame{
    position:absolute;
    inset:18px;
    border:1px solid rgba(200,135,58,.35);
    pointer-events:none;
  }
  .border-frame-inner{
    position:absolute;
    inset:24px;
    border:1px solid rgba(200,135,58,.18);
    pointer-events:none;
  }

  /* Faixa de topo */
  .top-band{
    position:absolute;
    top:0;left:0;right:0;
    height:8px;
    background:linear-gradient(90deg,#8b5a2b,#c8873a,#e8c897,#c8873a,#8b5a2b);
  }
  /* Faixa de base */
  .bottom-band{
    position:absolute;
    bottom:0;left:0;right:0;
    height:8px;
    background:linear-gradient(90deg,#8b5a2b,#c8873a,#e8c897,#c8873a,#8b5a2b);
  }

  /* Ornamentos de canto */
  .corner{
    position:absolute;
    width:28px;height:28px;
    opacity:.6;
  }
  .corner svg{fill:none;stroke:#c8873a;stroke-width:1.5}
  .corner.tl{top:28px;left:28px}
  .corner.tr{top:28px;right:28px;transform:scaleX(-1)}
  .corner.bl{bottom:28px;left:28px;transform:scaleY(-1)}
  .corner.br{bottom:28px;right:28px;transform:scale(-1,-1)}

  /* Conteúdo central */
  .content{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:40px 60px;
    gap:0;
    width:100%;
  }

  .autora{
    font-family:'Lato',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#c8873a;
    margin-bottom:28px;
  }
  .autora::before,.autora::after{
    content:' ✦ ';
    opacity:.7;
  }

  .linha{
    width:200px;
    height:1px;
    background:linear-gradient(90deg,transparent,#c8873a,transparent);
    margin-bottom:28px;
  }

  .titulo-doce{
    font-family:'Playfair Display',serif;
    font-size:72px;
    font-weight:700;
    font-style:italic;
    color:#fdf3e4;
    line-height:1;
    letter-spacing:2px;
    margin-bottom:4px;
  }
  .titulo-equilibrio{
    font-family:'Playfair Display',serif;
    font-size:80px;
    font-weight:900;
    color:#fdf3e4;
    line-height:1;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .titulo-equilibrio span{
    color:#c8873a;
  }

  .subtitulo{
    font-family:'Lato',sans-serif;
    font-size:14px;
    font-weight:300;
    color:#e8c897;
    line-height:1.7;
    letter-spacing:.5px;
    margin-bottom:32px;
    max-width:340px;
  }

  .badge-fit{
    display:inline-flex;
    align-items:center;
    gap:12px;
    border:1px solid #c8873a;
    padding:10px 28px;
    border-radius:2px;
    margin-bottom:36px;
    background:rgba(200,135,58,.08);
  }
  .badge-fit span{
    font-family:'Lato',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#c8873a;
  }
  .badge-fit .sep{
    color:#8b5a2b;
    font-size:16px;
    letter-spacing:0;
  }

  .divisor{
    width:100%;
    height:1px;
    background:linear-gradient(90deg,transparent,#8b5a2b 20%,#8b5a2b 80%,transparent);
    margin-bottom:28px;
  }

  .categorias{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:28px;
  }
  .cat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:rgba(200,135,58,.1);
    border:1px solid rgba(200,135,58,.25);
    border-radius:4px;
    padding:10px 12px;
    width:88px;
  }
  .cat .icon{font-size:22px;line-height:1}
  .cat .label{
    font-size:9px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:#c8873a;
    text-align:center;
    line-height:1.3;
  }

  .receitas-info{
    font-family:'Lato',sans-serif;
    font-size:12px;
    font-weight:400;
    color:#e8c897;
    letter-spacing:1px;
    opacity:.8;
  }
  .receitas-info strong{
    color:#c8873a;
    font-weight:700;
  }

  /* Fundo com textura sutil — círculos dourados muito faint */
  .bg-decor{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    opacity:.04;
  }
  .bg-decor circle{fill:#c8873a}
</style>
</head>
<body>

<!-- Faixas e bordas decorativas -->
<div class="top-band"></div>
<div class="bottom-band"></div>
<div class="border-frame"></div>
<div class="border-frame-inner"></div>

<!-- Ornamentos de canto -->
<div class="corner tl">
  <svg viewBox="0 0 28 28"><path d="M2 26 L2 2 L26 2"/><path d="M2 14 L8 14 M14 2 L14 8"/></svg>
</div>
<div class="corner tr">
  <svg viewBox="0 0 28 28"><path d="M2 26 L2 2 L26 2"/><path d="M2 14 L8 14 M14 2 L14 8"/></svg>
</div>
<div class="corner bl">
  <svg viewBox="0 0 28 28"><path d="M2 26 L2 2 L26 2"/><path d="M2 14 L8 14 M14 2 L14 8"/></svg>
</div>
<div class="corner br">
  <svg viewBox="0 0 28 28"><path d="M2 26 L2 2 L26 2"/><path d="M2 14 L8 14 M14 2 L14 8"/></svg>
</div>

<!-- Textura de fundo -->
<svg class="bg-decor" xmlns="http://www.w3.org/2000/svg">
  <circle cx="80" cy="120" r="180"/><circle cx="520" cy="700" r="220"/>
  <circle cx="300" cy="425" r="280"/><circle cx="80" cy="730" r="100"/>
  <circle cx="520" cy="120" r="90"/>
</svg>

<!-- Conteúdo principal -->
<div class="content">

  <div class="autora">Karina</div>

  <div class="linha"></div>

  <div class="titulo-doce">Doce</div>
  <div class="titulo-equilibrio">Equil<span>í</span>brio</div>

  <p class="subtitulo">Sobremesas que equilibram prazer e saúde<br>no dia a dia</p>

  <div class="badge-fit">
    <span>Tradicional</span>
    <span class="sep">+</span>
    <span>FIT</span>
  </div>

  <div class="divisor"></div>

  <div class="categorias">
    <div class="cat">
      <span class="icon">🍫</span>
      <span class="label">Chocolatu&shy;dos</span>
    </div>
    <div class="cat">
      <span class="icon">🍮</span>
      <span class="label">Mousses &amp; Cremes</span>
    </div>
    <div class="cat">
      <span class="icon">🍑</span>
      <span class="label">Pomar no Prato</span>
    </div>
    <div class="cat">
      <span class="icon">🎂</span>
      <span class="label">Bolos &amp; Tortas</span>
    </div>
    <div class="cat">
      <span class="icon">🥳</span>
      <span class="label">Doces de Festa</span>
    </div>
  </div>

  <p class="receitas-info"><strong>25+</strong> receitas · cada uma em duas versões</p>

</div>

</body>
</html>
