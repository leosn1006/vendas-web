# Rotação dos logs do Docker (json-file): sem isso o log cresce sem limite
# (o do nginx chegou a 1,2 GB). Vale ao (re)criar cada container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  db:
    image: mysql:8.4
    container_name: vendas-mysql
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"  # Acesso via SSH tunnel (não expõe para internet)
    environment:
      - MYSQL_DATABASE=vendasdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=America/Sao_Paulo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=1
      --wait-timeout=300
      --interactive-timeout=300
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
    volumes:
      # Persistência dos dados no Ubuntu (ajuste o caminho conforme necessário)
      - /var/lib/mysql-vendas:/var/lib/mysql
      # Script de inicialização do banco
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
      image: redis:7.2-alpine
      container_name: vendas-redis
      logging: *logging
      restart: unless-stopped
      environment:
        - TZ=America/Sao_Paulo
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes  # persistência AOF ativada
      networks:
        - webnet
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

