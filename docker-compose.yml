  flower:
    image: mher/flower:2.0
    container_name: vendas-flower
    logging: *logging
    restart: unless-stopped
    command: celery flower --port=5555
    environment:
      - TZ=America/Sao_Paulo
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"  # só localhost, nunca expõe para internet
    networks:
      - webnet

  beat:
    build: .
    container_name: vendas-beat
    logging: *logging
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    environment:
      - TZ=America/Sao_Paulo
