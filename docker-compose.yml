services:

  db:
    image: mysql:8.4
    container_name: vendas-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"  # Acesso via SSH tunnel (não expõe para internet)
    environment:
      - MYSQL_DATABASE=vendasdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=America/Sao_Paulo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=1
      --wait-timeout=300
      --interactive-timeout=300
    volumes:
      # Persistência dos dados no Ubuntu (ajuste o caminho conforme necessário)
      - /var/lib/mysql-vendas:/var/lib/mysql
      # Script de inicialização do banco
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
      image: redis:7.2-alpine
      container_name: vendas-redis
      restart: unless-stopped
      environment:
        - TZ=America/Sao_Paulo
      volumes:
        - redis_data:/data
      command: redis-server --appendonly yes  # persistência AOF ativada
      networks:
        - webnet
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  app:
    build: .
    container_name: vendas-web-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_APP_SECRET_LSN=${WHATSAPP_APP_SECRET_LSN:-}
      - WHATSAPP_APP_SECRET_LSSD=${WHATSAPP_APP_SECRET_LSSD:-}
      - WHATSAPP_APP_SECRET_RC=${WHATSAPP_APP_SECRET_RC:-}
      - WHATSAPP_APP_SECRET_LC=${WHATSAPP_APP_SECRET_LC:-}
      - WHATSAPP_APP_SECRET_LSDS=${WHATSAPP_APP_SECRET_LSDS:-}
      - WHATSAPP_APP_SECRET_KPN=${WHATSAPP_APP_SECRET_KPN:-}
      - WHATSAPP_APP_SECRET_JU=${WHATSAPP_APP_SECRET_JU:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_ACCESS_TOKEN_LSN=${WHATSAPP_ACCESS_TOKEN_LSN:-}
      - WHATSAPP_ACCESS_TOKEN_LSSD=${WHATSAPP_ACCESS_TOKEN_LSSD:-}
      - WHATSAPP_ACCESS_TOKEN_RC=${WHATSAPP_ACCESS_TOKEN_RC:-}
      - WHATSAPP_ACCESS_TOKEN_LC=${WHATSAPP_ACCESS_TOKEN_LC:-}
      - WHATSAPP_ACCESS_TOKEN_LSDS=${WHATSAPP_ACCESS_TOKEN_LSDS:-}
      - WHATSAPP_ACCESS_TOKEN_KPN=${WHATSAPP_ACCESS_TOKEN_KPN:-}
      - WHATSAPP_ACCESS_TOKEN_JU=${WHATSAPP_ACCESS_TOKEN_JU:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=vendasdb
      - DB_USER=appuser
