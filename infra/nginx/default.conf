server {
    listen 443 ssl http2;
    server_name kpnlivros.com.br www.kpnlivros.com.br;

    ssl_certificate     /etc/nginx/certs/kpnlivros_chain.pem;
    ssl_certificate_key /etc/nginx/certs/kpnlivros.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; return 404; }
    location ~* ^.*(wp-|wordpress|xmlrpc|wlwmanifest) { return 444; }
    location ~* \.(php|phtml|php3|php4|php5|php7|phps|phar)$ { return 444; }
    location ~* (config\.|aws|credentials|\.env|\.git|\.sql|\.zip|\.tar|\.gz|backup|dump) { return 444; }

    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|acunetix|nessus|scanner)) {
        return 444;
    }

    location /static/audios/ {
        alias /usr/share/nginx/static/audios/;
        add_header Content-Disposition "inline";
        expires 7d;
        add_header Cache-Control "public, immutable";
        types {
            audio/mpeg              mp3;
            audio/mp4               m4a;
            "audio/ogg; codecs=opus" ogg;
            video/mp4               mp4;
            video/webm              webm;
        }
    }

    location /static/arquivos/ {
        alias /usr/share/nginx/static/arquivos/;
        add_header Content-Disposition "attachment";
        expires 7d;
        add_header Cache-Control "public, immutable";
        types {
            application/pdf pdf;
            application/zip zip;
        }
    }

    location /static/images/ {
        alias /usr/share/nginx/static/images/;
        add_header Content-Disposition "inline";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1d;
    }

    location = /api/v1/webhook/gravar-lide {
        set $cors_origin "";
        if ($http_origin ~* "^https://(deliciasdalu\.online)$") {
            set $cors_origin $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;

        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

