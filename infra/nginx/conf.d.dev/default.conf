# Config de nginx para desenvolvimento local.
#
# Só tem o bloco HTTP puro (sem SSL) — os blocos de produção em
# infra/nginx/conf.d/default.conf referenciam certificados Let's Encrypt
# que só existem no VPS, e o nginx -t falha o arquivo inteiro se faltar um
# certificado, derrubando até esse bloco de dev junto.
#
# Ativado via NGINX_CONF_DIR=./infra/nginx/conf.d.dev no .env local (nunca
# commitado). Sem essa variável, o docker-compose.yml usa a pasta de
# produção normalmente — mesmo comando (`docker compose up -d`) nos dois
# ambientes, só muda o volume montado.
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1d;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}
