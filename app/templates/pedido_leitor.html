<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.nome }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --verde: #4a7c59;
            --cinza-bg: #f5f5f5;
            --borda: #ddd;
            --texto: #222;
            --sub: #666;
        }

        html, body {
            height: 100%;
            font-family: 'Lato', sans-serif;
            background: var(--cinza-bg);
            color: var(--texto);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header.leitor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #fff;
            border-bottom: 1px solid var(--borda);
            flex-shrink: 0;
        }
        .btn-voltar {
            color: var(--texto);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .header-acoes {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-salvar {
            background: var(--verde);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 14px;
            cursor: pointer;
        }
        .btn-salvar:disabled { opacity: .6; cursor: default; }
        .icone-ajustes {
            color: var(--sub);
            font-size: 16px;
            user-select: none;
        }

        main.leitor-main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            text-align: center;
        }

        .titulo-livro {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .canvas-wrap {
            display: flex;
            justify-content: center;
            max-width: 760px;
            margin: 0 auto;
        }
        #pdf-canvas {
            max-width: 100%;
            border: 1px solid var(--borda);
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        footer.leitor-footer {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid var(--borda);
            padding: 10px 16px 16px;
        }

        .zoom-bar, .paginacao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .zoom-bar { margin-bottom: 10px; }

        .zoom-bar button, .paginacao button {
            background: var(--cinza-bg);
            border: 1px solid var(--borda);
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--texto);
        }
        .zoom-bar button:disabled, .paginacao button:disabled {
            opacity: .4;
            cursor: default;
        }

        #zoom-label { font-size: 13px; color: var(--sub); min-width: 44px; }
        #pagina-label { font-size: 13px; color: var(--sub); }

        .erro-pdf {
            max-width: 320px;
            margin: 32px auto 0;
            font-size: 14px;
            color: var(--sub);
            line-height: 1.5;
        }

        /* ── RESPONSIVO — desktop (≥1024px). Mobile-first: tudo acima é o layout base
           (celular). Mesma convenção usada em checkout.html. ── */
        @media (min-width: 1024px) {
            header.leitor-header, footer.leitor-footer { padding-left: 32px; padding-right: 32px; }
            main.leitor-main { padding: 32px; }
            .titulo-livro { font-size: 19px; }
        }

        /* ── Overlay de progresso do download ── */
        .download-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        /* [hidden] e .download-overlay têm a mesma especificidade — sem essa regra, o
           display:flex acima vence e o overlay fica visível (bloqueando clique) mesmo com o
           atributo hidden presente no HTML. */
        .download-overlay[hidden] {
            display: none;
        }
        .download-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px 22px;
            max-width: 300px;
            width: 100%;
            text-align: center;
        }
        .download-titulo {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .download-arquivo {
            font-size: 12px;
            color: var(--sub);
            margin-bottom: 14px;
            word-break: break-word;
        }
        .download-barra {
            height: 8px;
            border-radius: 4px;
            background: var(--cinza-bg);
            overflow: hidden;
            margin-bottom: 10px;
        }
        .download-barra-preenchida {
            height: 100%;
            width: 0%;
            background: var(--verde);
            border-radius: 4px;
            transition: width .15s ease-out;
        }
        .download-percentual {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 6px;
        }
        .download-destino {
            font-size: 11px;
            color: var(--sub);
            opacity: .8;
        }
    </style>
</head>
<body>
    <header class="leitor-header">
        <a class="btn-voltar" href="/pedido/{{ guid }}">← Meus livros</a>
        <div class="header-acoes">
            <button id="btn-salvar" class="btn-salvar" type="button">⬇ Salvar</button>
            <!-- Decorativo por ora, sem função (confirmado) -->
            <span class="icone-ajustes" title="Ajustes">⚙</span>
        </div>
    </header>

    <main class="leitor-main">
        <div class="titulo-livro">{{ item.nome }}</div>
        <div class="canvas-wrap">
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div id="erro-pdf" class="erro-pdf" hidden>
            😕 Não foi possível carregar esse material agora. Tente recarregar a página em instantes.
        </div>
    </main>

    <div id="download-overlay" class="download-overlay" hidden>
        <div class="download-card">
            <div class="download-titulo">Baixando seu e-book…</div>
            <div id="download-arquivo" class="download-arquivo"></div>
            <div class="download-barra">
                <div id="download-barra-preenchida" class="download-barra-preenchida"></div>
            </div>
            <div id="download-percentual" class="download-percentual">0%</div>
            <div class="download-destino">Vai para a pasta de downloads do seu aparelho</div>
        </div>
    </div>

    <footer class="leitor-footer">
        <div class="zoom-bar">
            <button id="btn-zoom-out">A−</button>
            <span id="zoom-label">100%</span>
            <button id="btn-zoom-in">A+</button>
        </div>
        <div class="paginacao">
            <button id="btn-pag-anterior">← Página anterior</button>
            <span id="pagina-label">Página 1 de …</span>
            <button id="btn-pag-seguinte">Página seguinte →</button>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = '/pedido/{{ guid }}/arquivo/{{ item.id }}';
        const nomeArquivo = {{ item.nome_arquivo | tojson }};

        let pdfDoc = null, pageNum = 1;
        // scale === null até a primeira página renderizar — nesse momento calculamos o
        // "fitScale" (zoom que preenche a largura disponível de .canvas-wrap) e usamos como
        // 100% de referência. Assim o zoom inicial já vem correto tanto no celular (coluna
        // estreita) quanto no desktop (coluna mais larga), sem precisar de breakpoints
        // separados só pra isso.
        let scale = null, fitScale = 1, stepScale = 0.1, minScale = 0.1, maxScale = 5;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.querySelector('.canvas-wrap');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnAnterior = document.getElementById('btn-pag-anterior');
        const btnSeguinte = document.getElementById('btn-pag-seguinte');
        const btnSalvar = document.getElementById('btn-salvar');

        function mostrarErroPdf() {
            document.getElementById('erro-pdf').hidden = false;
            canvasWrap.style.display = 'none';
            document.querySelector('.leitor-footer').style.display = 'none';
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                if (scale === null) {
                    const naoEscalado = page.getViewport({ scale: 1 });
                    const larguraDisponivel = canvasWrap.clientWidth || naoEscalado.width;
                    fitScale = larguraDisponivel / naoEscalado.width;
                    scale = fitScale;
                    stepScale = fitScale * 0.15;
                    minScale = fitScale * 0.5;
                    maxScale = fitScale * 2.5;
                }

                const viewport = page.getViewport({ scale });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                page.render({ canvasContext: ctx, viewport });

                document.getElementById('pagina-label').textContent =
                    `Página ${num} de ${pdfDoc.numPages}`;
                document.getElementById('zoom-label').textContent =
                    `${Math.round((scale / fitScale) * 100)}%`;

                btnAnterior.disabled = num <= 1;
                btnSeguinte.disabled = num >= pdfDoc.numPages;
                btnZoomOut.disabled = scale <= minScale;
                btnZoomIn.disabled = scale >= maxScale;
            }).catch(mostrarErroPdf);
        }

        pdfjsLib.getDocument(url).promise.then(doc => {
            pdfDoc = doc;
            renderPage(pageNum);
        }).catch(mostrarErroPdf);

        btnAnterior.addEventListener('click', () => {
            if (!pdfDoc || pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });
        btnSeguinte.addEventListener('click', () => {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });
        btnZoomIn.addEventListener('click', () => {
            if (!pdfDoc) return;
            scale = Math.min(maxScale, scale + stepScale);
            renderPage(pageNum);
        });
        btnZoomOut.addEventListener('click', () => {
            if (!pdfDoc) return;
            scale = Math.max(minScale, scale - stepScale);
            renderPage(pageNum);
        });

        // Mostra uma barra de progresso durante o download e depois salva o arquivo — sem
        // nunca abrir aba nova, em qualquer navegador.
        //
        // Tentamos antes fazer o fetch()+blob+<a download> salvar o arquivo direto (sem
        // segunda requisição). Não é confiável entre navegadores: no Safari, um <a download>
        // apontando pra um blob de PDF costuma ser ignorado (abre no visualizador inline em
        // vez de baixar) mesmo com o blob tipado como application/octet-stream; no Firefox,
        // às vezes abre em outra aba. Ambos são comportamentos específicos de cada motor de
        // navegador pra blob URLs, não algo que dá pra controlar de forma confiável via JS.
        //
        // Por isso o fetch() aqui serve só pra ACOMPANHAR o progresso (lendo em streaming,
        // sem guardar os bytes em memória) — o salvamento de verdade é sempre feito por uma
        // navegação nativa pra ?download=1, que responde com Content-Disposition: attachment.
        // Isso é o mecanismo padrão de download do HTTP: o navegador NUNCA troca de página
        // nem abre aba nova pra uma resposta attachment, em nenhum navegador — só entrega pro
        // gerenciador de downloads dele. O custo é buscar o arquivo 2x (uma vez só pra medir
        // progresso, outra vez pra salvar de verdade) — aceitável pro tamanho de um e-book.
        const overlay = document.getElementById('download-overlay');
        const overlayArquivo = document.getElementById('download-arquivo');
        const overlayBarra = document.getElementById('download-barra-preenchida');
        const overlayPercentual = document.getElementById('download-percentual');

        // Duração mínima da barra na tela: em conexão rápida (ou localhost), o download real
        // termina em bem menos de 1s — sem esse piso, a barra "pisca" e some quase na hora, e
        // o cliente não tem tempo de perceber que aquilo era progresso (pode até achar que foi
        // um bug). pctPeloTempo() cresce de forma constante até 100% ao longo de DURACAO_MINIMA_MS;
        // o que a barra mostra é sempre o MENOR entre o progresso real e esse ritmo mínimo — então
        // um download mais lento que DURACAO_MINIMA_MS continua mostrando o progresso real (nunca
        // fica pra trás do que de fato chegou), e só o caso rápido demais é esticado visualmente.
        const DURACAO_MINIMA_MS = 2000;

        btnSalvar.addEventListener('click', async () => {
            btnSalvar.disabled = true;
            overlayArquivo.textContent = nomeArquivo;
            overlayBarra.style.width = '0%';
            overlayPercentual.textContent = '0%';
            overlay.hidden = false;

            const inicio = Date.now();
            const pctPeloTempo = () => Math.min(100, Math.round(((Date.now() - inicio) / DURACAO_MINIMA_MS) * 100));
            const atualizarBarra = (pctReal) => {
                const pct = Math.min(pctReal, pctPeloTempo());
                overlayBarra.style.width = pct + '%';
                overlayPercentual.textContent = pct + '%';
            };

            try {
                const resp = await fetch(url);
                const totalBytes = parseInt(resp.headers.get('Content-Length') || '0', 10);
                if (resp.ok && resp.body && totalBytes > 0) {
                    const reader = resp.body.getReader();
                    let recebidos = 0;
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        recebidos += value.length;
                        atualizarBarra(Math.round((recebidos / totalBytes) * 100));
                    }
                } else if (resp.body) {
                    // Sem Content-Length (proxy que remove o header, resposta não-2xx) — não dá
                    // pra mostrar progresso granular, mas precisa drenar/cancelar o corpo antes
                    // de abrir uma segunda conexão pro mesmo host (?download=1 logo abaixo),
                    // senão essa primeira requisição fica pendurada disputando uma das conexões
                    // simultâneas limitadas do navegador com o download de verdade.
                    await resp.body.cancel();
                }
            } catch (e) {
                // Falha ao acompanhar o progresso não impede o download em si — só não mostra
                // a barra completa. O salvamento de verdade sempre acontece pela navegação
                // abaixo, fora deste try.
            }

            // Se o download real já terminou antes do piso de tempo, continua animando a
            // barra no ritmo mínimo até completar — em vez de pular direto pra 100% e sumir.
            while (Date.now() - inicio < DURACAO_MINIMA_MS) {
                atualizarBarra(100);
                await new Promise(r => setTimeout(r, 50));
            }
            overlayBarra.style.width = '100%';
            overlayPercentual.textContent = '100%';

            setTimeout(() => {
                window.location.href = url + '?download=1';
                overlay.hidden = true;
                btnSalvar.disabled = false;
            }, 150);
        });
    </script>
</body>
</html>
