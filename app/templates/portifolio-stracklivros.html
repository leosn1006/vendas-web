<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strack Livros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --azul:    #1e3a5f;
            --dourado: #c9a227;
            --creme:   #f5f0e8;
            --escuro:  #1a2a3a;
            --branco:  #ffffff;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--creme);
            color: var(--escuro);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--branco);
            border-bottom: 1px solid #dde5f0;
            padding: 16px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--azul), var(--dourado));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--azul);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 64px 24px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 900;
            color: var(--azul);
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 15px;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">📚</div>
        <span class="logo-text">Strack Livros</span>
    </div>
</header>

<main>
    <div class="hero">
        <h1>Strack Livros</h1>
        <p>Bem-vindo(a).</p>
    </div>
</main>

<footer>
    <p>© 2026 Strack Livros.</p>
</footer>

</body>
</html>
