{% extends 'admin/base.html' %}
{% block title %}Dados Básicos — {{ produto.nome }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Dados Básicos</div>
        <div class="page-subtitle">{{ produto.nome }}</div>
    </div>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">

            <div class="form-group span-2">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" name="nome" value="{{ produto.nome or '' }}" required>
            </div>

            <div class="form-group span-2">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="4">{{ produto.descricao or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0"
                       value="{{ produto.preco or '' }}">
            </div>

            <div class="form-group">
                <label for="valor_minimo_pagamento">Valor mínimo de pagamento (R$)</label>
                <input type="number" id="valor_minimo_pagamento" name="valor_minimo_pagamento"
                       step="0.01" min="0" value="{{ produto.valor_minimo_pagamento or '' }}">
            </div>

            <div class="form-group span-2">
                <label for="pix_destinatario_esperado">PIX destinatário esperado</label>
                <input type="text" id="pix_destinatario_esperado" name="pix_destinatario_esperado"
                       value="{{ produto.pix_destinatario_esperado or '' }}"
                       placeholder="CPF, CNPJ, e-mail ou chave aleatória">
            </div>

            <div class="form-group span-2">
                <label for="google_sheets_spreadsheet_id">Google Sheets — ID da planilha</label>
                <input type="text" id="google_sheets_spreadsheet_id" name="google_sheets_spreadsheet_id"
                       value="{{ produto.google_sheets_spreadsheet_id or '' }}"
                       placeholder="Ex: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
            </div>

            <div class="form-group">
                <label for="google_sheets_sheet_name">Google Sheets — Nome da aba</label>
                <input type="text" id="google_sheets_sheet_name" name="google_sheets_sheet_name"
                       value="{{ produto.google_sheets_sheet_name or 'Página1' }}"
                       placeholder="Página1">
            </div>

            <div class="form-group">
                <label for="google_ads_conversion_name">Google Ads — Nome da conversão</label>
                <input type="text" id="google_ads_conversion_name" name="google_ads_conversion_name"
                       value="{{ produto.google_ads_conversion_name or '' }}"
                       placeholder="Ex: Venda WhatsApp">
            </div>

            <div class="form-group span-2">
                <label for="url_pdf">Arquivo PDF principal (nome do arquivo)</label>
                <input type="text" id="url_pdf" name="url_pdf"
                       value="{{ produto.url_pdf or '' }}"
                       placeholder="Ex: guia-paes-saudaveis.pdf">
            </div>

            <div class="form-group span-2">
                <label for="url_pdf_bonus">Arquivo PDF bônus (nome do arquivo)</label>
                <input type="text" id="url_pdf_bonus" name="url_pdf_bonus"
                       value="{{ produto.url_pdf_bonus or '' }}"
                       placeholder="Ex: bolos-fofinhos.pdf (opcional)">
            </div>

            <div class="form-group span-2">
                <label for="email_remetente">E-mail remetente (De:)</label>
                <input type="email" id="email_remetente" name="email_remetente"
                       value="{{ produto.email_remetente or '' }}"
                       placeholder="Ex: paes@lsnlivros.com.br">
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
