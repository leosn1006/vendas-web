{% extends 'admin/base.html' %}
{% block title %}Conversas Web — {{ produto.nome }}{% endblock %}

{% block extra_css %}
<style>
    .search-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .search-row input {
        flex: 1;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Conversas Web</div>
        <div class="page-subtitle">{{ produto.nome }}</div>
    </div>
</div>

<div class="card" style="margin-bottom: 20px;">
    <form method="POST" action="{{ url_for('admin.conversas_email_produto', produto_id=produto.id) }}">
        <div class="search-row">
            <input type="text" name="q"
                   value="{{ request.form.get('q', '') }}"
                   placeholder="Nº do pedido, e-mail ou nome do cliente"
                   required>
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>
</div>
{% endblock %}
