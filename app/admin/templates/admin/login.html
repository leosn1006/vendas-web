<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LN Editor Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #fdf6ec;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .login-logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #5c3d1e, #8a5a2f);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .login-logo-text {
            font-size: 20px;
            font-weight: 600;
            color: #3d2510;
        }

        .login-header span {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #e07b2a;
            font-family: 'DM Mono', monospace;
            margin-bottom: 6px;
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 600;
            color: #3d2510;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e8ddd0;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 4px 24px rgba(92,61,30,0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #888;
            font-family: 'DM Mono', monospace;
        }

        input {
            background: #fdf6ec;
            border: 1px solid #e8ddd0;
            border-radius: 8px;
            padding: 12px 14px;
            color: #2c2c2c;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            transition: border-color 0.15s, box-shadow 0.15s;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: #e07b2a;
            box-shadow: 0 0 0 3px rgba(224,123,42,0.12);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #e07b2a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-login:hover {
            background: #c96a1a;
            transform: translateY(-1px);
        }

        .alert-danger {
            background: rgba(220,38,38,0.08);
            color: #dc2626;
            border: 1px solid rgba(220,38,38,0.20);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            font-family: 'DM Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-header">
            <div class="login-logo">
                <div class="login-logo-icon">🌿</div>
                <span class="login-logo-text">LN Editor</span>
            </div>
            <span>painel administrativo</span>
            <h1>Acesse sua conta</h1>
        </div>

        <div class="login-card">
            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert-{{ category }}">{{ message }}</div>
            {% endfor %}

            <form method="POST">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required autofocus placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Entrar no painel</button>
            </form>
        </div>

        <p class="login-footer">LN Editor · Área restrita</p>
    </div>
</body>
</html>
