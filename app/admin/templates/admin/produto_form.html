{% extends "admin/base.html" %}
{% block title %}Novo Produto{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Novo Produto</h1>
        <p class="page-subtitle">Preencha os dados essenciais — o restante (venda web, e-mail, etc.) é configurado depois, na tela "Dados Básicos" do produto</p>
    </div>
    <a href="{{ url_for('admin.listar_produtos') }}" class="btn btn-ghost">← Voltar</a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="nome" required value="">
            </div>

            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" name="preco" step="0.01" required value="">
            </div>

            <div class="form-group span-2">
                <label>Descrição</label>
                <textarea name="descricao"></textarea>
            </div>

        </div>

        <div class="form-actions">
            <a href="{{ url_for('admin.listar_produtos') }}" class="btn btn-ghost">Cancelar</a>
            <button type="submit" class="btn btn-primary">Criar Produto</button>
        </div>
    </form>
</div>
{% endblock %}
